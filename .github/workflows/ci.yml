name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux-seed:
    name: Compile Linux seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile seed (gcc -O2 -Wall -Wextra)
        run: gcc -O2 -Wall -Wextra -o /tmp/seed seeds/linux/seed.c
