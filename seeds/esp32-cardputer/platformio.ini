; ESP32 Seed — M5Stack Cardputer ADVANCE (StampS3A / ESP32-S3FN8, 8MB flash)
;
; Board definition ships in-tree (boards/m5stack-cardputer-adv.json) and
; references partitions/cardputer_8mb_ota.csv: dual 0x330000 OTA slots + SPIFFS.
;
; The seed boots, joins WiFi, drives the panel and the keyboard, and exposes
; /health, /capabilities, /ui, the OTA endpoints and two skills: gpio and
; serial. Skill sources live in src/skills/ and are excluded from the build by
; build_src_filter below, because main.cpp #includes them instead.
;
; Three things in the board JSON are load-bearing and easy to get wrong, and
; JSON cannot carry a comment, so they are recorded here:
;
;   - `memory_type` is qio_qspi, NOT the qio_opi the T-Embed and ATS-Mini seeds
;     use. The ESP32-S3FN8 in the StampS3A has 8MB of quad flash and no PSRAM at
;     all; qio_opi links the octal-PSRAM variant of the IDF libraries against a
;     board that has none. For the same reason -DBOARD_HAS_PSRAM is absent.
;   - `variant` is the generic esp32s3, NOT the m5stack_cardputer variant that
;     ships with arduino-esp32. That variant's pins_arduino.h defines SDA=13 and
;     SCL=15, which are Cardputer v1.1 values; on the ADVANCE those two pins are
;     the EXT 2.54-14P expansion header's UART and the I2C bus moved to 8/9. Any
;     library calling Wire.begin() with no arguments would drive the expansion
;     header's UART lines as an I2C bus.
;   - -DARDUINO_USB_CDC_ON_BOOT=1 is mandatory. M5Stack's own m5stack-stamps3
;     board omits it, and the device then boots with no console over USB at all.
;
; Flashing note (macOS, native USB-Serial/JTAG): with esptool's default post-
; upload "hard_reset" this chip is observed to sit in the bootloader after a
; successful write rather than run the image it was just given. watchdog_reset
; boots it, which is why board_upload.after_reset is set below; with that in
; place `pio run -t upload` is a single, complete operation. The remedy is
; reliable and reproducible here; no claim is made about the mechanism.

[platformio]
boards_dir = boards

[env:cardputer]
; Pinned to pioarduino (arduino-esp32 3.x). The registry `espressif32` platform
; still ships arduino-esp32 2.0.17, which predates the ESP32-S3 support this
; seed needs. The core tarball is named explicitly because the platform skips
; installing it when an older, same-named package is already in ~/.platformio.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
board = m5stack-cardputer-adv
framework = arduino
monitor_speed = 115200
; Host DTR/RTS toggling resets the chip on a native USB-Serial/JTAG port.
monitor_dtr = 0
monitor_rts = 0
board_upload.after_reset = watchdog_reset
upload_speed = 921600
board_build.filesystem = spiffs

lib_deps =
    ; 3.9.0 is a hard floor, not a preference: AsyncURIMatcher — which every
    ; route here is registered through — does not exist before it. The other
    ; seeds carry ^3.6.0 and only compile because the caret happens to resolve
    ; to a much later release; pin the floor where the API actually appeared.
    ESP32Async/ESPAsyncWebServer @ ^3.9.0
    ESP32Async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.4.2
    ; M5Cardputer is what makes the ADVANCE's panel and keyboard usable: it is
    ; the only place the TCA8418 key matrix is mapped to characters, and its
    ; Keyboard_Class picks that reader at RUNTIME from M5.getBoard(). On a board
    ; that reads back as a Cardputer v1.1 it installs the GPIO scan-matrix
    ; reader instead, which strobes 8/9/11 — the I2C bus and the keyboard
    ; controller's interrupt. Detection succeeding is therefore load-bearing;
    ; see the cfg.fallback_board note in main.cpp.
    ;
    ; ^1.1.1, from the registry. ADVANCE support landed in 1.1.0 (the floor that
    ; matters), and 1.1.1 is the newest release the PlatformIO registry has.
    ; There is a 1.2.0 GIT TAG upstream, but it was never published to the
    ; registry and its own library.properties still says version=1.1.1, so
    ; `@^1.2.0` does not resolve at all. Do not "upgrade" to it by hand.
    m5stack/M5Cardputer @ ^1.1.1
    ; M5Cardputer's own library.json declares both of these as "*" — completely
    ; unpinned — so without these two lines the build silently floats to
    ; whatever the registry serves that day. The floors are where
    ; board_M5CardputerADV first exists as an enum value: M5Unified 0.2.8 and
    ; M5GFX 0.2.10. Below those the library still compiles and still runs, and
    ; simply never identifies this board — the same class of trap as the
    ; AsyncURIMatcher floor above, where a caret that happened to resolve high
    ; enough hid a missing API. The pins here are the versions this seed was
    ; built and flashed against, both comfortably above their floors.
    m5stack/M5Unified @ ^0.2.19
    m5stack/M5GFX @ ^0.2.26

build_src_filter = +<*> -<skills/>

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=3000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; Belt and braces for M5GFX's panel autodetection, and deliberately NOT a
    ; substitute for cfg.fallback_board in main.cpp — the two do different jobs.
    ;
    ; What this define actually does is seed autodetect()'s starting guess, so
    ; the FIRST attempt goes straight to the Cardputer probe instead of walking
    ; every other S3 board on the way. That is the whole benefit and it is worth
    ; less than it looks: init_impl() calls autodetect() in a retry loop of up
    ; to five passes and assigns its return value back over the guess, so a
    ; failed first pass hands board_unknown to the second and every later pass
    ; sweeps the full table anyway. Fewer unrelated pins get driven at boot only
    ; when the panel answers immediately, which is the case that was never the
    ; problem. It does NOT force the answer: the ADVANCE-vs-v1.1 decision is still
    ; made by reading GPIO 8/9 against 5/6, and if the ST7789 does not answer at
    ; all the function still returns board_unknown. It is also ignored outright
    ; when NVS already holds a cached AUTODETECT key from an earlier run, which
    ; is why nothing may depend on it.
    -DM5GFX_BOARD=board_t::board_M5CardputerADV
