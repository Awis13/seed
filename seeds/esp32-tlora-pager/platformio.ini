; ESP32 Seed — LILYGO T-Lora Pager 868 (ESP32-S3, 16MB flash, 8MB PSRAM)
;
; Board definition ships in-tree (boards/lilygo-t-lora-pager.json) and
; references partitions/tlora-pager_16mb_ota.csv: dual 4MB OTA slots + SPIFFS.
;
; This is the bring-up seed: it boots, joins WiFi and exposes /health +
; /capabilities + OTA. No board peripheral is driven — the 480x222 display, the
; TCA8418 keyboard, the SX1262, GNSS, NFC, the ES8311 codec and the BQ27220
; gauge all wait behind an XL9555 IO expander whose pin map has not been read
; out of the vendor library yet.
;
; PSRAM note: this board carries EXTERNAL QSPI flash and PSRAM (the vendor says
; so explicitly, as opposed to in-package OPI on some other S3 boards), hence
; memory_type qio_qspi rather than the qio_opi our ATS-Mini port uses. If PSRAM
; comes back as 0 in /capabilities this is the first line to suspect.
;
; Flashing note (macOS, native USB-Serial/JTAG): esptool's default post-upload
; "hard_reset" leaves the chip waiting in the bootloader — watchdog_reset is
; the documented workaround and boots the freshly flashed image.

[platformio]
boards_dir = boards

[env:tlora-pager]
; Pinned to pioarduino (arduino-esp32 3.x), same as the other ESP32-S3 seeds in
; this repo. The registry `espressif32` platform still ships arduino-esp32
; 2.0.17. The core tarball is named explicitly because the platform skips
; installing it when an older, same-named package is already in ~/.platformio.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
board = lilygo-t-lora-pager
framework = arduino
monitor_speed = 115200
; Host DTR/RTS toggling resets the chip on a native USB-Serial/JTAG port.
monitor_dtr = 0
monitor_rts = 0
board_upload.after_reset = watchdog_reset
upload_speed = 921600
board_build.filesystem = spiffs
; Optional: pin upload to a specific USB port. All ESP32-S3 devices share
; VID/PID 303A:1001 — use `pio device list` and match SER= (board MAC).
; upload_port = /dev/cu.usbmodem1101

lib_deps =
    ; exact() lives in 3.9.0+; notify routes refuse prefix matching because
    ; /notify would otherwise swallow /notify/ack (see skills/notify.cpp).
    ESP32Async/ESPAsyncWebServer @ ^3.9.0
    ESP32Async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.4.2
    ; Hardware PCNT quadrature — same lib as tembed, glitch filter on.
    madhephaestus/ESP32Encoder @ 0.12.0
    ; MeshCore private-link radio stack (same stack as Heltec companion).
    ; Core sources: lib/meshcore (vendored subset). Crypto: lib/ed25519.
    jgromes/RadioLib @ ^7.6.0
    rweather/Crypto @ ^0.4.0
    ; WireGuard: vendored lib/WireGuard-ESP32 (patched for Arduino-ESP32 3 / IDF5,
    ; tcpip_adapter → lwIP netif_default). Do not pull ciniml from registry.
    SPI
    Wire

; skills/ are #include'd into main.cpp (same pattern as tembed).
build_src_filter =
    +<*>
    -<skills/>

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=3000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; --- MeshCore / SX1262 (match home Heltec: 869.618 SF8 BW62.5) ---
    ; Includes come from lib/meshcore (PIO auto) + lib/ed25519.
    -DESP32_PLATFORM=1
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -DUSE_SX1262=1
    -DRADIO_CLASS=CustomSX1262
    -DWRAPPER_CLASS=CustomSX1262Wrapper
    -DLORA_FREQ=869.618
    -DLORA_BW=62.5
    -DLORA_SF=8
    -DLORA_CR=5
    -DLORA_TX_POWER=22
    -DSX126X_DIO3_TCXO_VOLTAGE=3.0
    -DSX126X_DIO2_AS_RF_SWITCH=true
    -DSX126X_CURRENT_LIMIT=140
    -DSX126X_RX_BOOSTED_GAIN=1
    -DP_LORA_NSS=36
    -DP_LORA_DIO_1=14
    -DP_LORA_RESET=47
    -DP_LORA_BUSY=48
    -DP_LORA_SCLK=35
    -DP_LORA_MISO=33
    -DP_LORA_MOSI=34
    -DPIN_BOARD_SDA=3
    -DPIN_BOARD_SCL=2
    -DMAX_CONTACTS=32
    -DENABLE_ADVERT_ON_BOOT=0
    -DED25519_NO_SEED=1

