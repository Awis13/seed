; ESP32 Seed — LILYGO T-Lora Pager 868 (ESP32-S3, 16MB flash, 8MB PSRAM)
;
; Board definition ships in-tree (boards/lilygo-t-lora-pager.json) and
; references partitions/tlora-pager_16mb_ota.csv: dual 4MB OTA slots + SPIFFS.
;
; This is the bring-up seed: it boots, joins WiFi and exposes /health +
; /capabilities + OTA. No board peripheral is driven — the 480x222 display, the
; TCA8418 keyboard, the SX1262, GNSS, NFC, the ES8311 codec and the BQ27220
; gauge all wait behind an XL9555 IO expander whose pin map has not been read
; out of the vendor library yet.
;
; PSRAM note: this board carries EXTERNAL QSPI flash and PSRAM (the vendor says
; so explicitly, as opposed to in-package OPI on some other S3 boards), hence
; memory_type qio_qspi rather than the qio_opi our ATS-Mini port uses. If PSRAM
; comes back as 0 in /capabilities this is the first line to suspect.
;
; Flashing note (macOS, native USB-Serial/JTAG): esptool's default post-upload
; "hard_reset" leaves the chip waiting in the bootloader — watchdog_reset is
; the documented workaround and boots the freshly flashed image.

[platformio]
boards_dir = boards

[env:tlora-pager]
; Pinned to pioarduino (arduino-esp32 3.x), same as the other ESP32-S3 seeds in
; this repo. The registry `espressif32` platform still ships arduino-esp32
; 2.0.17. The core tarball is named explicitly because the platform skips
; installing it when an older, same-named package is already in ~/.platformio.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
board = lilygo-t-lora-pager
framework = arduino
monitor_speed = 115200
; Host DTR/RTS toggling resets the chip on a native USB-Serial/JTAG port.
monitor_dtr = 0
monitor_rts = 0
board_upload.after_reset = watchdog_reset
upload_speed = 921600
board_build.filesystem = spiffs
; Optional: pin upload to a specific USB port. All ESP32-S3 devices share
; VID/PID 303A:1001 — use `pio device list` and match SER= (board MAC).
; upload_port = /dev/cu.usbmodem1101

lib_deps =
    ; exact() lives in 3.9.0+; notify routes refuse prefix matching because
    ; /notify would otherwise swallow /notify/ack (see skills/notify.cpp).
    ESP32Async/ESPAsyncWebServer @ ^3.9.0
    ESP32Async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.4.2
    ; Hardware PCNT quadrature — same lib as tembed, glitch filter on.
    madhephaestus/ESP32Encoder @ 0.12.0
    ; MeshCore private-link radio stack (same stack as Heltec companion).
    ; Core sources: lib/meshcore (vendored subset). Crypto: lib/ed25519.
    jgromes/RadioLib @ ^7.6.0
    ; EXACT pin, not a caret range, for two independent reasons.
    ; 1. A caret would silently move to 0.5.0 the day rweather ships it.
    ; 2. microReticulum declares a transitive git dependency also named
    ;    "Crypto" (attermann/Crypto, unpinned, tracks master). PlatformIO
    ;    deduplicates library dependencies by NAME and installs the direct
    ;    ones first, so today the registry package below wins and the fork is
    ;    never fetched — but nothing in the tree records WHICH Crypto landed
    ;    (.piopm carries spec.uri: null). tools/test_crypto_pin.py asserts the
    ;    installed one is owned by rweather; if it ever fails, the fork took
    ;    the slot and MeshCore/RadioLib built against it silently.
    rweather/Crypto @ 0.4.0
    ; WireGuard: vendored lib/WireGuard-ESP32 (patched for Arduino-ESP32 3 / IDF5,
    ; tcpip_adapter → lwIP netif_default). Do not pull ciniml from registry.
    ; SD = framework lib. Mounted on the SHARED FSPI bus (hw_ui_spi()) — never a
    ; second SPIClass on the same pins. agents.cpp holds the chat history.
    SPI
    Wire
    SD
    ; Reticulum stack (identity + transport core only in C1: no interface is
    ; registered and no radio is touched). Pinned to the 0.5.0 TAG on purpose —
    ; master has an undeclared-dependency tree (Crypto/ArduinoJson) that does
    ; not resolve. Transitively pulls MsgPack (+ArxContainer, ArxTypeTraits,
    ; DebugLog), attermann/microStore and an unpinned attermann/Crypto git fork
    ; that collides by name with the registry Crypto pinned above.
    attermann/microReticulum@0.5.0

; skills/ are #include'd into main.cpp (same pattern as tembed).
build_src_filter =
    +<*>
    -<skills/>

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    ; Chat (agents_store_append/bridge POST) plus WiFi + mesh all run on the
    ; 8KB default loop task; streaming writes kept the stack small, but a
    ; headroom bump avoids the old Stack canary / loopTask panic on Enter.
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=3000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; --- MeshCore / SX1262 (match home Heltec: 869.618 SF8 BW62.5) ---
    ; Includes come from lib/meshcore (PIO auto) + lib/ed25519.
    -DESP32_PLATFORM=1
    -DRADIOLIB_STATIC_ONLY=1
    -DRADIOLIB_GODMODE=1
    -DUSE_SX1262=1
    -DRADIO_CLASS=CustomSX1262
    -DWRAPPER_CLASS=CustomSX1262Wrapper
    -DLORA_FREQ=869.618
    -DLORA_BW=62.5
    -DLORA_SF=8
    -DLORA_CR=5
    -DLORA_TX_POWER=22
    -DSX126X_DIO3_TCXO_VOLTAGE=3.0
    -DSX126X_DIO2_AS_RF_SWITCH=true
    -DSX126X_CURRENT_LIMIT=140
    -DSX126X_RX_BOOSTED_GAIN=1
    -DP_LORA_NSS=36
    -DP_LORA_DIO_1=14
    -DP_LORA_RESET=47
    -DP_LORA_BUSY=48
    -DP_LORA_SCLK=35
    -DP_LORA_MISO=33
    -DP_LORA_MOSI=34
    -DPIN_BOARD_SDA=3
    -DPIN_BOARD_SCL=2
    -DMAX_CONTACTS=32
    -DENABLE_ADVERT_ON_BOOT=0
    -DED25519_NO_SEED=1
    ; --- Reticulum (microReticulum 0.5.0 + microStore) ---
    ; microStore defaults to UniversalFileSystem, which on ESP32 is the POSIX
    ; adapter and mounts LittleFS. This board's data partition is SPIFFS, so the
    ; SPIFFS adapter is selected explicitly (and skills/rns.cpp calls
    ; init(false) — init(true) would FORMAT the partition on a failed probe,
    ; taking /mesh_identity.id, /gw_token.txt and the notify store with it).
    -DUSTORE_USE_SPIFFS
    -DRNS_USE_FS
    ; Path table in RAM, not in SPIFFS. This is a hard requirement of the TCP
    ; interface's drain budget, not a preference. At the library default of 1
    ; (Type.h) the path store is a microStore::BasicFileStore, so every announce
    ; Transport accepts runs Transport::inbound() -> _new_path_table.put() ->
    ; FileStore::put(), i.e. flush_buffer() + persist_index_entry() +
    ; compact_if_threshold() — a flash page erase inside a loop budgeted at 8 ms,
    ; and an rnsd dumps its whole announce backlog the moment the socket opens.
    ; At 0 the store is a BasicHeapStore: the announce path never touches flash,
    ; `paths` in /rns/status still counts, Transport still routes, and the one
    ; piece of state that genuinely has to survive a reboot is the node identity,
    ; which skills/rns.cpp persists itself. It also compiles out
    ; Transport::write_path_table()'s `while (_saving_path_table) sleep(0.2)`,
    ; which is guarded by the same macro.
    -DRNS_PERSIST_PATHS=0
    ; MsgPack pulls DebugLog, which otherwise compiles in at TRACE.
    -DDEBUGLOG_DEFAULT_LOG_LEVEL_ERROR
    ; Log.h #warns and defaults to VERBOSE; every level kept is .rodata we pay
    ; for in flash. ERROR is the floor that still reports real failures, and it
    ; is a COMPILE-TIME floor: the WARNING/INFO/TRACE call sites vanish, so the
    ; runtime RNS::loglevel() call in skills/rns.cpp must not ask for more.
    -DRNS_LOG_LEVEL=RNS_LOG_LEVEL_ERROR
    ; The library's own heap, i.e. the platform heap — the ONLY setting that
    ; leaves the rest of the image alone. Every other value of this macro makes
    ; Utilities/Memory.cpp define a NON-weak global `operator new` (the
    ; __attribute__((weak)) on it is commented out upstream), which displaces
    ; libstdc++'s and reroutes every `new` in the firmware — AsyncTCP,
    ; ESPAsyncWebServer, RadioLib, MeshCore, our own skills — through the
    ; library's allocator. That allocator also returns nullptr for size == 0,
    ; so the override throws std::bad_alloc on `new T[0]`, which the standard
    ; requires to succeed. RNS_HEAP_ALLOCATOR compiles the whole override block
    ; out (Memory.cpp guards it with `#if RNS_DEFAULT_ALLOCATOR !=
    ; RNS_HEAP_ALLOCATOR`) and the stack allocates from the same heap as
    ; everything else. Consequence: Memory::default_allocator_alloc()/free()
    ; stay at 0 — they are only bumped inside that block.
    -DRNS_DEFAULT_ALLOCATOR=RNS_HEAP_ALLOCATOR

