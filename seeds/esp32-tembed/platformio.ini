; ESP32 Seed — LilyGO T-Embed CC1101 (ESP32-S3, 16MB flash, 8MB PSRAM)
;
; Board definition ships in-tree (boards/lilygo-t-embed-cc1101.json) and
; references partitions/tembed_16mb_ota.csv: dual 4MB OTA slots + SPIFFS.
;
; Flashing note (macOS, native USB-Serial/JTAG): esptool's default post-upload
; "hard_reset" leaves the chip waiting in the bootloader — watchdog_reset is
; the documented workaround and boots the freshly flashed image.

[platformio]
boards_dir = boards

[env:tembed]
; Pinned to pioarduino (arduino-esp32 3.x). The registry `espressif32` platform
; still ships arduino-esp32 2.0.17, which predates this board's ESP32-S3 OPI
; PSRAM support. The core tarball is named explicitly because the platform skips
; installing it when an older, same-named package is already in ~/.platformio.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
board = lilygo-t-embed-cc1101
framework = arduino
monitor_speed = 115200
; Host DTR/RTS toggling resets the chip on a native USB-Serial/JTAG port.
monitor_dtr = 0
monitor_rts = 0
board_upload.after_reset = watchdog_reset
upload_speed = 921600
board_build.filesystem = spiffs

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.4.2
    bodmer/TFT_eSPI @ 2.5.43
    ; Quadrature via the ESP32 pulse-counter peripheral: the edges are counted
    ; in hardware with a glitch filter, so contact bounce never reaches the CPU
    ; and turning the knob does not compete with WiFi for interrupt latency.
    madhephaestus/ESP32Encoder @ 0.12.0

build_src_filter = +<*> -<skills/>

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=3000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; ---- TFT_eSPI: ST7789 170x320 on HSPI (replaces User_Setup_Select.h) ----
    ; The panel and the CC1101 share this SPI bus; the display library owns
    ; the bus after setup(), the CC1101 is only probed before tft.init().
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DUSE_HSPI_PORT=1
    ; IPS panel ships inverted; without this every colour is its complement.
    -DTFT_INVERSION_ON=1
    ; Native portrait geometry, driven at rotation 3. Do NOT swap these two:
    ; 170 is what makes TFT_eSPI apply the 35px CGRAM offset this panel needs.
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_BL=21
    -DTFT_MISO=10
    -DTFT_MOSI=9
    -DTFT_SCLK=11
    -DTFT_CS=41
    -DTFT_DC=16
    -DTFT_RST=-1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    ; Font 8 is the 75px digit set (chars "1234567890:-." only) — the big HH:MM
    ; on the clock face. ~3KB of flash.
    -DLOAD_FONT8=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
