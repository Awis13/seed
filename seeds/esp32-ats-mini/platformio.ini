; ESP32 Seed — ATS Mini v4 (ESP32-S3, 16MB flash, OPI PSRAM)
;
; Board definition ships in-tree (boards/ats-mini.json) and references
; partitions/ats-mini_16mb_ota.csv: dual 4MB OTA slots + SPIFFS.
;
; This is the bring-up seed: it boots, joins WiFi and exposes /health +
; /capabilities honest to the ATS hardware, ready for OTA. The SI4732 radio,
; the parallel ST7789 display and SSB are deliberately NOT driven here — a
; radio driver is something an agent grows later in a separate step.
;
; Flashing note (macOS, native USB-Serial/JTAG): esptool's default post-upload
; "hard_reset" leaves the chip waiting in the bootloader — watchdog_reset is
; the documented workaround and boots the freshly flashed image.

[platformio]
boards_dir = boards

[env:ats-mini]
; Pinned to pioarduino (arduino-esp32 3.x). The registry `espressif32` platform
; still ships arduino-esp32 2.0.17, which predates this board's ESP32-S3 OPI
; PSRAM support. The core tarball is named explicitly because the platform skips
; installing it when an older, same-named package is already in ~/.platformio.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.3.9/esp32-core-3.3.9.tar.xz
board = ats-mini
framework = arduino
monitor_speed = 115200
; Host DTR/RTS toggling resets the chip on a native USB-Serial/JTAG port.
monitor_dtr = 0
monitor_rts = 0
board_upload.after_reset = watchdog_reset
upload_speed = 921600
board_build.filesystem = spiffs

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.2
    bblanchon/ArduinoJson @ ^7.4.2
    pu2clr/PU2CLR SI4735 @ ^2.1.8
    bodmer/TFT_eSPI @ 2.5.43

build_src_filter = +<*> -<skills/>

build_flags =
    -Wall
    -Wextra
    -Wno-unused-parameter
    -DCONFIG_ASYNC_TCP_MAX_ACK_TIME=3000
    -DCONFIG_ASYNC_TCP_PRIORITY=10
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=128
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
    -DCONFIG_ASYNC_TCP_STACK_SIZE=16384
    ; --- TFT_eSPI: parallel 8-bit ST7789 panel (verified on this ATS-Mini v4).
    ; Backlight (GPIO38) is deliberately NOT handed to TFT_eSPI (-DTFT_BL): the
    ; display skill drives it via ledc so the panel never flashes before init.
    ; INIT_SEQUENCE_3 + CGRAM_OFFSET are required for this particular panel.
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER
    -DINIT_SEQUENCE_3
    -DCGRAM_OFFSET
    -DTFT_RGB_ORDER=TFT_RGB
    -DTFT_INVERSION_ON
    -DTFT_PARALLEL_8_BIT
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_CS=6
    -DTFT_DC=7
    -DTFT_RST=5
    -DTFT_WR=8
    -DTFT_RD=9
    -DTFT_D0=39
    -DTFT_D1=40
    -DTFT_D2=41
    -DTFT_D3=42
    -DTFT_D4=45
    -DTFT_D5=46
    -DTFT_D6=47
    -DTFT_D7=48
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DLOAD_FONT4
    -DLOAD_FONT6
    -DLOAD_FONT7
    -DLOAD_GFXFF
    -DSMOOTH_FONT
